name: Publier le portfolio

on:
  push:
    branches:
      - main
    paths:
      - site.zip
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le portfolio
        uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          mkdir -p _site
          unzip -q site.zip -d _site
          touch _site/.nojekyll

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Mettre en ligne
        id: deployment
        uses: actions/deploy-pages@v4
